<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- HOME PAGE -->
    <div id="homepage">
        <div class="flex header-area">
            <h2 data-i18n="home.title" class="grow">Zil...</h2>
            <button id="refreshBtn" class="icon-btn" data-i18n-title="home.refresh" title="Check now">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            </button>
            <button id="markReadBtn" class="icon-btn" data-i18n-title="home.markAllRead" title="Mark all as read">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
            </button>
            <button id="filterImportantBtn" class="icon-btn" data-i18n-title="home.importantOnly" title="Show only important">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </button>
            <button id="addingPageBtn" class="icon-btn" title="Add">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <button id="settingsBtn" class="icon-btn" title="Settings">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
        </div>

        <div class="view-toggle">
            <button id="viewVideosBtn" class="view-btn" data-i18n="home.viewVideos">Videos</button>
            <button id="viewChannelsBtn" class="view-btn" data-i18n="home.viewChannels">Channels</button>
        </div>

        <div id="liveStripWrap" class="live-strip-wrap" hidden>
            <button id="liveLeft" class="icon-btn small" data-i18n-title="home.scrollLeft" title="Scroll left">‹</button>
            <div id="liveStrip" class="live-strip"></div>
            <button id="liveRight" class="icon-btn small" data-i18n-title="home.scrollRight" title="Scroll right">›</button>
        </div>

        <div id="channelSearchWrap" class="search-wrap" style="display: none;">
            <input type="text" id="channelSearch" data-i18n-placeholder="home.search" placeholder="Search channels">
        </div>

        <div id="homeEmpty" class="empty-state" data-i18n="home.nothing">
            No items found.
        </div>
        <div id="videoList" class="channel-list"></div>
        <div id="channelList" class="channel-list"></div>
    </div>

    <!-- SETTINGS PAGE -->
    <div id="settingsPage" style="display: none;">
        <div class="flex header-area" style="justify-content: flex-start;">
            <button id="backBtnSettings" class="icon-btn">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <h2 data-i18n="settings.title">Settings</h2>
        </div>

        <div class="flex border">
            <label for="lang" data-i18n="settings.langs.label">Language</label>
            <div class="select-wrapper">
                <select name="lang" id="lang">
                    <option value="en" data-i18n="settings.langs.en">English</option>
                    <option value="tr" data-i18n="settings.langs.tr">Türkçe</option>
                </select>
                <svg class="select-arrow" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
        </div>

        <div class="flex border">
            <label for="darkMode" data-i18n="settings.darkMode">Dark Mode</label>
            <input type="checkbox" name="darkMode" id="darkMode" class="check">
        </div>

        <details class="settings-group">
            <summary>
                <span data-i18n="settings.groups.checks">Checks</span>
                <svg class="details-arrow" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </summary>
            <div class="content">
                <div class="flex setting-row">
                    <label for="checkInterval" data-i18n="settings.interval.label">Check interval</label>
                    <div class="select-wrapper">
                        <select name="checkInterval" id="checkInterval">
                            <option value="15" data-i18n="settings.interval.o15">Every 15 minutes</option>
                            <option value="30" data-i18n="settings.interval.o30">Every 30 minutes</option>
                            <option value="60" data-i18n="settings.interval.o60">Every hour</option>
                            <option value="120" data-i18n="settings.interval.o120">Every 2 hours</option>
                        </select>
                        <svg class="select-arrow" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                </div>
                <div class="flex setting-row">
                    <label for="liveMode" data-i18n="settings.live.label">Live detection</label>
                    <div class="select-wrapper">
                        <select name="liveMode" id="liveMode">
                            <option value="auto" data-i18n="settings.live.auto">Auto (on for all)</option>
                            <option value="manual" data-i18n="settings.live.manual">Manual (per channel)</option>
                            <option value="off" data-i18n="settings.live.off">Off</option>
                        </select>
                        <svg class="select-arrow" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                </div>
                <div class="flex setting-row" id="liveIntervalRow">
                    <label for="liveInterval" data-i18n="settings.liveInterval.label">Live check interval</label>
                    <div class="select-wrapper">
                        <select name="liveInterval" id="liveInterval">
                            <option value="15" data-i18n="settings.interval.o15">Every 15 minutes</option>
                            <option value="30" data-i18n="settings.interval.o30">Every 30 minutes</option>
                            <option value="60" data-i18n="settings.interval.o60">Every hour</option>
                            <option value="120" data-i18n="settings.interval.o120">Every 2 hours</option>
                        </select>
                        <svg class="select-arrow" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                </div>
            </div>
        </details>
        <details class="settings-group">
            <summary>
                <span data-i18n="settings.groups.notifications">Notifications</span>
                <svg class="details-arrow" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </summary>
            <div class="content">
                <div class="flex setting-row">
                    <label for="notifyMode" data-i18n="settings.mode.label">Notifications</label>
                    <div class="select-wrapper">
                        <select name="notifyMode" id="notifyMode">
                            <option value="all" data-i18n="settings.mode.all">Notification + badge</option>
                            <option value="badge" data-i18n="settings.mode.badge">Badge only</option>
                            <option value="off" data-i18n="settings.mode.off">Off</option>
                        </select>
                        <svg class="select-arrow" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                </div>
                <div class="flex setting-row">
                    <label for="quietEnable" data-i18n="settings.quiet.label">Quiet hours</label>
                    <input type="checkbox" name="quietEnable" id="quietEnable" class="check">
                </div>
                <div class="sub-group" id="quietSub">
                    <div class="flex setting-row">
                        <label for="quietStart" data-i18n="settings.quiet.from">From</label>
                        <div class="select-wrapper">
                            <select name="quietStart" id="quietStart"></select>
                            <svg class="select-arrow" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </div>
                    <div class="flex setting-row">
                        <label for="quietEnd" data-i18n="settings.quiet.to">To</label>
                        <div class="select-wrapper">
                            <select name="quietEnd" id="quietEnd"></select>
                            <svg class="select-arrow" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </div>
                </div>
                <div class="flex setting-row">
                    <label for="importantBypass" data-i18n="settings.importantBypass">Important bypasses quiet hours</label>
                    <input type="checkbox" name="importantBypass" id="importantBypass" class="check">
                </div>
                <div class="setting-row">
                    <button id="testNotifBtn" class="btn secondary btn-block" data-i18n="settings.testNotif">Send test notification</button>
                </div>
            </div>
        </details>
        <details class="settings-group">
            <summary>
                <span data-i18n="settings.groups.content">Content</span>
                <svg class="details-arrow" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </summary>
            <div class="content">
                <div class="flex setting-row">
                    <label for="skipShorts" data-i18n="settings.shorts">Skip Shorts</label>
                    <input type="checkbox" name="skipShorts" id="skipShorts" class="check">
                </div>
                <p class="hint" data-i18n="settings.contentHint">Fine-tune per video with Title Rules below.</p>
            </div>
        </details>
        <details class="settings-group" id="groupRules">
            <summary>
                <span data-i18n="settings.groups.rules">Title Rules</span>
                <span id="ruleCount" class="group-badge">0</span>
                <svg class="details-arrow" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </summary>
            <div class="content">
                <div id="ruleList" class="rules-scroll"></div>
                <input type="text" id="ruleInput" class="grow" data-i18n-placeholder="settings.rulePlaceholder" placeholder="Pattern, e.g. shorts|trailer">
                <div class="flex rules-form-row">
                    <div class="select-wrapper">
                        <select id="ruleField">
                            <option value="title" data-i18n="settings.ruleFieldTitle">Title</option>
                            <option value="channel" data-i18n="settings.ruleFieldChannel">Channel</option>
                            <option value="both" data-i18n="settings.ruleFieldBoth">Both</option>
                        </select>
                        <svg class="select-arrow" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                    <div class="select-wrapper">
                        <select id="ruleAction">
                            <option value="block" data-i18n="settings.ruleBlock">Block</option>
                            <option value="notify" data-i18n="settings.ruleNotify">Notify</option>
                            <option value="important" data-i18n="settings.ruleImportant">Important</option>
                        </select>
                        <svg class="select-arrow" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                    <button id="ruleAddBtn" class="btn secondary grow" data-i18n="settings.ruleAdd">Add</button>
                </div>
                    <div class="setting-row">
                        <button id="ruleTestBtn" class="btn secondary btn-block" data-i18n="settings.ruleTest">Test rules</button>
                    </div>
                    <p class="hint" data-i18n="settings.ruleOrderHint">First match wins — use the arrows to reorder.</p>
                    <p class="hint" data-i18n="settings.ruleMatchHint">Patterns match anywhere inside the text — no need for .* wrappers.</p>
            </div>
        </details>
        <details class="settings-group">
            <summary>
                <span data-i18n="settings.groups.backup">Backup</span>
                <svg class="details-arrow" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </summary>
            <div class="content">
                <div class="flex setting-row btn-row">
                    <button id="exportBtn" class="btn secondary grow" data-i18n="settings.export">Export backup</button>
                    <button id="importBtn" class="btn secondary grow" data-i18n="settings.import">Import backup</button>
                    <input type="file" id="importFile" accept="application/json,.json" hidden>
                </div>
                <div class="setting-row">
                    <button id="restoreBtn" class="btn secondary btn-block" data-i18n="settings.restore">Restore auto backup</button>
                </div>
                <p id="backupStatus" class="muted" hidden></p>
            </div>
        </details>
    </div>

    <!-- ADDING PAGE -->
    <div id="addingPage" style="display: none;">
        <div class="flex header-area" style="justify-content: flex-start;">
            <button id="backBtnAdd" class="icon-btn">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <h2 data-i18n="addingPage.title">Add New Channel</h2>
        </div>

        <div class="form-group">
            <label for="channelInput" data-i18n="addingPage.channelName">Channel Name / URL</label>
            <input type="text" id="channelInput" data-i18n-placeholder="addingPage.channelPlaceholder" placeholder="e.g. YouTube Channel">
        </div>

        <button id="saveChannelBtn" class="btn" data-i18n="addingPage.submitBtn">Save & Start</button>
        <p id="addError" class="error" hidden></p>

        <details>
            <summary>
                <span data-i18n="settings.advanced">Advanced Options</span>
                <svg class="details-arrow" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </summary>
            <div class="content">
            </div>
        </details>
    </div>

  <div id="modalOverlay" class="modal-overlay" hidden>
      <div class="modal-box">
          <div class="flex header-area">
              <h2 id="modalTitle" class="grow">Settings</h2>
              <button id="modalClose" class="icon-btn" title="Close">×</button>
          </div>
          <div id="modalBody"></div>
      </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
